[package]
name = "leaseq-engine"
description = "Durable, asynchronous queue engine: single writer, group commit, compaction."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
leaseq-core.workspace = true
leaseq-wal.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
