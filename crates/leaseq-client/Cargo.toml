[package]
name = "leaseq-client"
description = "Async client and worker runtime for leaseq."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
leaseq-proto.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
serde = "1.0.229"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
